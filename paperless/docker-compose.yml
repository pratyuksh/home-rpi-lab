services:
  broker:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      - broker
    ports:
      - "8000:8000"
    volumes:
      - /mnt/mydisk/home-rpi-lab/paperless/data:/usr/src/paperless/data
      - /mnt/mydisk/home-rpi-lab/paperless/media:/usr/src/paperless/media
      - /mnt/mydisk/home-rpi-lab/paperless/config:/usr/src/paperless/config
      - /mnt/mydisk/home-rpi-lab/paperless/consume:/usr/src/paperless/consume
    env_file: docker-compose.env
    environment:
      PAPERLESS_REDIS: redis://broker:6379

volumes:
  redis_data:
